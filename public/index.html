<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ショート動画で紹介した便利グッズの一覧。" />
  <meta name="robots" content="noindex,nofollow" />
  <title>紹介した商品 | 人生の質を上げたい</title>
  <link rel="icon" type="image/webp" href="./brand-icon.webp" />
  <style>
    :root { color-scheme: light; font-family: system-ui,-apple-system,'Noto Sans JP',sans-serif; color:#24272b; background:#f7f7f5 }
    * { box-sizing:border-box } body { margin:0 } main { max-width:680px; padding:52px 20px 80px; margin:auto }
    .brand { display:flex; align-items:center; gap:14px; margin-bottom:34px; text-decoration:none; color:inherit }
    .brand-logo { width:64px; height:64px; border-radius:50%; object-fit:cover; flex:none }
    .brand-title { display:block; font-size:18px; font-weight:750; letter-spacing:-.035em }
    .brand-caption { display:block; color:#777; font-size:12px; margin-top:4px }
    .brand:hover .brand-title { text-decoration:underline; text-underline-offset:3px }
    .eyebrow { font-size:12px; letter-spacing:.14em; font-weight:750; color:#777 } h1 { font-size:clamp(25px,5vw,38px); letter-spacing:-.04em; margin:12px 0 }
    .intro { color:#686b70; line-height:1.8; margin:0 0 24px } .notice { background:#eaeae6; border-radius:10px; padding:12px 15px; color:#555; font-size:12px; line-height:1.7 }
    .heading { display:flex; justify-content:space-between; align-items:center; margin:34px 0 14px } h2 { font-size:17px; margin:0 }
    .card { background:white; border:1px solid #e7e7e4; border-radius:16px; padding:21px; margin:0 0 12px; box-shadow:0 2px 9px #00000005 }
    .meta { font-size:12px; color:#85878a; margin:0 0 9px } .name { font-size:17px; margin:0 0 8px } .desc { color:#686b70; font-size:14px; line-height:1.7; margin:0 0 16px }
    .action { display:inline-flex; text-decoration:none; background:#222; color:white; border-radius:9px; padding:12px 16px; font-size:14px; font-weight:700; min-height:44px; align-items:center }
    .action:hover { background:#444 } .pending { color:#777; font-size:13px } .empty { color:#777; line-height:1.7 } footer { margin-top:36px; color:#888; font-size:12px; line-height:1.7 }
    main { max-width:760px } .card { padding:22px; margin-bottom:18px }
    .card-content { display:grid; grid-template-columns:168px minmax(0,1fr); gap:22px; align-items:start }
    .thumbnail { display:block; position:relative; aspect-ratio:9/16; border-radius:12px; overflow:hidden; background:#efefed; color:white; text-decoration:none }
    .thumbnail img { width:100%; height:100%; object-fit:cover; display:block }
    .thumbnail::after { content:'▶'; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:42px; height:42px; display:grid; place-items:center; padding-left:3px; border-radius:50%; background:#151515b3; font-size:18px; box-shadow:0 2px 12px #0003 }
    .thumbnail:hover::after { background:#d62626 } .thumbnail:focus-visible,.video-title a:focus-visible,.action:focus-visible,.watch-link:focus-visible { outline:3px solid #3068c2; outline-offset:4px }
    .video-title { font-size:19px; line-height:1.55; letter-spacing:-.025em; margin:0 0 16px; overflow-wrap:anywhere }
    .video-title a { color:inherit; text-decoration:none } .video-title a:hover { text-decoration:underline; text-underline-offset:3px }
    .product-name { font-size:14px; line-height:1.6; font-weight:700; margin:0 0 8px } .desc { font-size:13px }
    .actions { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-top:16px }
    .watch-link { color:#555; font-size:13px; padding:9px 0; min-height:44px; display:inline-flex; align-items:center; text-underline-offset:3px }
    .other-videos { border-top:1px solid #ecece8; padding-top:12px; margin-top:18px; font-size:12px; line-height:1.7 }
    .other-videos p { color:#777; margin:0 0 5px } .other-videos a { display:block; color:#555; text-underline-offset:3px; padding:4px 0 }
    @media (max-width:520px) { main { padding:32px 16px 64px } .card { padding:16px } .card-content { grid-template-columns:112px minmax(0,1fr); gap:14px } .video-title { font-size:16px; margin-bottom:12px } .action { padding:11px 12px; font-size:12px } .actions { gap:4px 12px } }
    @media (max-width:350px) { .card-content { grid-template-columns:90px minmax(0,1fr); gap:12px } .video-title { font-size:15px } }
      .collection-feature {border-top:4px solid #b21f2d;padding:22px 0;margin-bottom:24px}
    .collection-feature h2 {font-size:23px;margin:8px 0 14px}.rank-nav {display:grid;gap:8px}
    .rank-nav a {display:block;color:#24272b;background:white;border:1px solid #e7e7e4;border-radius:10px;padding:13px 15px;line-height:1.5;font-size:14px;text-decoration:none;min-height:44px}
    .rank-nav a:hover {border-color:#b21f2d}.spec {font-size:13px;font-weight:700;line-height:1.6}
    .caution {font-size:12px;color:#686b70;line-height:1.7}.card {scroll-margin-top:16px}.rank-nav a:focus-visible {outline:3px solid #3068c2;outline-offset:3px}
  </style>
  <script src="./products.js" defer></script>
  <script src="./site.js" defer></script>
</head>
<body><main>
  <a class="brand" href="https://www.youtube.com/channel/UCWhtZh-NrhihGEJPbMqrdJw" target="_blank" rel="noopener noreferrer" aria-label="人生の質を上げたい のYouTubeチャンネルへ">
    <img class="brand-logo" src="./brand-icon.webp" alt="" width="64" height="64" />
    <span><span class="brand-title">人生の質を上げたい</span><span class="brand-caption">YouTube Shorts で紹介した商品</span></span>

  <div class="eyebrow">SHORTS ITEM LIST</div>

  <div class="notice">広告・PR：このページには楽天アフィリエイトおよびAmazonアソシエイトの広告が含まれます。<br>Amazonのアソシエイトとして、当サイトは適格販売により収入を得ています。</div>

</main></body></html>
