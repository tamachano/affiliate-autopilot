name: Review SUZURI Drafts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pod-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read-only official preview verification
        env:
          SUZURI_API_TOKEN: ${{ secrets.SUZURI_API_TOKEN }}
        run: python3 pod/review-products.py
      - uses: actions/upload-artifact@v4
        with:
          name: pod-official-review
          path: pod-review/
          retention-days: 1
          if-no-files-found: error
