name: Publish Approved SUZURI Products
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pod-publish-approved.yml']
permissions:
  contents: read
concurrency:
  group: pod-suzuri-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Publish only three owner-approved products
        env:
          SUZURI_API_TOKEN: ${{ secrets.SUZURI_API_TOKEN }}
        run: python3 pod/publish-approved.py
