name: Check SUZURI Connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read-only SUZURI connection check
        env:
          SUZURI_API_TOKEN: ${{ secrets.SUZURI_API_TOKEN }}
        run: python3 pod/check-suzuri.py
